<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f5ef">
<meta name="description" content="گفتگوی آنلاین با خدمات امور مشترکین راضی؛ پیگیری سیم‌کارت رایگان و بسته‌های اینترنتی.">
<title>راضی | چت خدمات آنلاین</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
:root{
  --paper:#f8f5ef;--white:#fffefa;--ink:#17151e;--muted:#77727d;
  --purple:#7046e8;--purple-dark:#4e2bb5;--orange:#ff7048;--lemon:#e9fa76;
  --pink:#ffb8d4;--line:#e8e2d9;--shadow:0 18px 55px rgba(35,25,50,.09);
  --shadow-strong:0 28px 70px rgba(35,25,50,.16);--max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;overflow-x:hidden;padding-bottom:35px}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}svg{display:block}
::selection{background:var(--lemon);color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.wrap{width:min(calc(100% - 42px),var(--max));margin:auto}

/* BACKGROUND */
.background{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.background:before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(#8b7b9b 1px,transparent 1px);background-size:25px 25px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.bg-shape{position:absolute;border-radius:50%;filter:blur(2px)}
.bg-shape.one{width:300px;height:300px;background:#ffb8d4;top:8%;right:-230px;opacity:.42}
.bg-shape.two{width:350px;height:350px;background:#d8c8ff;top:55%;left:-270px;opacity:.48}
.bg-shape.three{width:180px;height:180px;background:#fff0a2;top:35%;right:65%;opacity:.32}

/* HERO */
.hero{padding:34px 0 20px;text-align:center}
.hero-label{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;background:#fff;border:1px solid var(--line);border-radius:50px;color:var(--purple);font-size:11px;font-weight:900;box-shadow:0 5px 18px #30204b09}
.soon-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px #ff704825}
.hero h1{margin-top:16px;font-size:clamp(30px,4.4vw,50px);line-height:1.45;font-weight:1000;letter-spacing:-1.8px}
.hero h1 .dark-line{display:block}
.hero h1 .color-line{display:inline-block;color:var(--purple);position:relative;z-index:1}
.hero h1 .color-line:after{content:"";position:absolute;right:0;bottom:5px;width:100%;height:13px;background:var(--lemon);z-index:-1;transform:rotate(-2deg)}

/* NEW PROMINENT HERO NOTICE */
.hero-notice{
  max-width:720px;margin:24px auto 0;display:flex;align-items:flex-start;gap:16px;
  padding:22px 26px;background:linear-gradient(135deg,#fff 0%,#fbfaff 100%);
  border:1.5px solid rgba(112,70,232,.25);border-radius:22px;
  box-shadow:0 12px 35px rgba(112,70,232,.08);text-align:right;
  animation:fadeUp .6s cubic-bezier(.2,.7,.2,1) .2s both;
}
.hero-notice-icon{
  width:46px;height:46px;flex-shrink:0;background:var(--purple);color:#fff;
  border-radius:14px;display:grid;place-items:center;
}
.hero-notice-icon svg{width:22px;height:22px}
.hero-notice-content strong{display:block;font-size:15px;font-weight:950;color:var(--purple-dark);margin-bottom:6px}
.hero-notice-content p{font-size:13.5px;color:var(--muted);line-height:2.1;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.hero-description{max-width:600px;margin:20px auto 0;color:#716c77;font-size:13px;line-height:2.2;font-weight:650}
.hero-description strong{color:var(--ink);font-weight:950}

/* NOTICE */
.notice{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;margin-bottom:22px;background:#fff;border:1.5px dashed rgba(112,70,232,.30);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow)}
.notice-icon{width:48px;height:48px;flex-shrink:0;background:var(--lemon);color:var(--ink);border-radius:15px 15px 15px 4px;display:grid;place-items:center}
.notice-icon svg{width:24px;height:24px}
.notice-copy{flex:1;min-width:220px}
.notice-copy strong{display:block;font-size:13px;font-weight:950}
.notice-copy p{font-size:11px;color:var(--muted);line-height:2;margin-top:3px;font-weight:650}
.notice-actions{display:flex;gap:9px;flex-wrap:wrap}
.notice-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:13px 13px 13px 4px;font-size:11px;font-weight:950;transition:.2s;white-space:nowrap;border:none}
.notice-btn svg{width:15px;height:15px}
.notice-btn.sim{background:#f8d4e6;color:#4b2341;box-shadow:0 4px 0 #e3aec7}
.notice-btn.net{background:#ffe0c6;color:#66351d;box-shadow:0 4px 0 #ecc39e}
.notice-btn:hover{transform:translateY(-3px)}
.notice-btn.sim:hover{box-shadow:0 7px 0 #e3aec7}
.notice-btn.net:hover{box-shadow:0 7px 0 #ecc39e}
.notice-btn:active{transform:translateY(1px)}

/* CHAT */
.chat-zone{padding-bottom:40px}
.chat-shell{display:flex;flex-direction:column;max-width:920px;margin:0 auto;height:calc(100vh - 150px);min-height:540px;max-height:800px;background:var(--white);border:1.5px solid var(--line);border-radius:30px 30px 30px 8px;box-shadow:var(--shadow-strong);overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--ink);color:#fff}
.chat-id{display:flex;align-items:center;gap:11px}
.chat-avatar{width:44px;height:44px;padding:3px;flex-shrink:0;border-radius:14px 14px 14px 4px;background:#ffffff12;border:1.5px solid #e9fa7655;display:grid;place-items:center;color:var(--lemon)}
.chat-avatar img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.chat-avatar .brand-fallback{font-size:18px}
.chat-name{font-size:13.5px;font-weight:950}
.chat-status{display:flex;align-items:center;gap:6px;font-size:9.5px;color:#b9f18b;font-weight:800;margin-top:3px}
.chat-status:before{content:"";width:6px;height:6px;border-radius:50%;background:#a6e76b}
.chat-status.typing{color:var(--lemon)}
.chat-status.typing:before{background:var(--lemon)}
.chat-badge{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#ffffff10;border:1px solid #ffffff22;border-radius:50px;font-size:9px;font-weight:900;color:#e8e2f2;white-space:nowrap}
.chat-badge svg{width:14px;height:14px;color:var(--lemon)}

.chat-body{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background-color:#f2ede2;background-image:radial-gradient(rgba(139,123,155,.10) 1px,transparent 1px);background-size:22px 22px;scroll-behavior:smooth}
.chat-body::-webkit-scrollbar{width:6px}
.chat-body::-webkit-scrollbar-thumb{background:#d8d0c2;border-radius:6px}

.day-chip{align-self:center;padding:5px 14px;background:#fff;border-radius:50px;font-size:9.5px;font-weight:850;color:#8a8390;box-shadow:0 3px 10px rgba(35,25,50,.06)}
.lock-chip{align-self:center;display:flex;align-items:center;gap:6px;padding:6px 13px;background:#fbf7d9;border-radius:50px;font-size:9px;font-weight:800;color:#8d8455;max-width:92%;text-align:center;line-height:1.9}
.lock-chip svg{width:12px;height:12px;flex-shrink:0}

.msg{max-width:78%;padding:10px 13px 7px;font-size:12.5px;font-weight:650;line-height:2;box-shadow:0 4px 14px rgba(35,25,50,.06);animation:msgIn .28s cubic-bezier(.2,.7,.2,1)}
.msg p{white-space:pre-wrap;word-break:break-word}
.msg p + p{margin-top:8px}
.msg.in{align-self:flex-start;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:18px 4px 18px 18px}
.msg.out{align-self:flex-end;background:#eef6bf;color:var(--ink);border:1px solid #dde8a8;border-radius:4px 18px 18px 18px}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:5px;font-size:8.5px;color:#a49d92;font-weight:750}
.ticks{width:15px;height:15px;color:#b6ae9f;transition:color .3s}
.msg.out.read .ticks{color:var(--purple)}

.reply-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.reply-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;background:var(--paper);border:1.5px solid rgba(112,70,232,.35);border-radius:50px;font-size:10.5px;font-weight:900;color:var(--purple-dark);box-shadow:0 3px 0 rgba(112,70,232,.18);transition:.2s}
.reply-chip:hover{transform:translateY(-2px);background:#fff}
.reply-chip svg{width:14px;height:14px}

.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--white);border:1px solid var(--line);border-radius:18px 4px 18px 18px;box-shadow:0 4px 14px rgba(35,25,50,.06)}
.typing i{width:7px;height:7px;border-radius:50%;background:#b9b2c2;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.chat-input{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--white);border-top:1px solid var(--line)}
.chat-input input{flex:1
